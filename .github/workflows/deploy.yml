name: Build and deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:latest

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Render manifests
        env:
          API_HOST: ${{ vars.API_HOST }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          GOOGLE_CLIENT_IDS: ${{ vars.GOOGLE_CLIENT_IDS }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          APPLE_CLIENT_IDS: ${{ vars.APPLE_CLIENT_IDS }}
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
          APNS_APP_IDS: ${{ vars.APNS_APP_IDS }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          PMO_API_URL: ${{ secrets.PMO_API_URL }}
          PMO_API_KEY: ${{ secrets.PMO_API_KEY }}
        run: |
          # k8s.yaml starts with the Namespace, so apply creates it before the Secret below.
          {
            sed -e "s|IMAGE_PLACEHOLDER|${IMAGE}:${SHA}|" -e "s|DEPLOY_ID_PLACEHOLDER|\"${SHA}-${GITHUB_RUN_ID}\"|" \
                -e "s|HOST_PLACEHOLDER|${API_HOST}|g" k8s.yaml
            echo '---'
            kubectl create secret generic dobre-mleko --namespace dobre-mleko --dry-run=client -o yaml \
              --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
              --from-literal=JWT_SECRET="$JWT_SECRET" \
              --from-literal=ADMIN_EMAILS="$ADMIN_EMAILS" \
              --from-literal=GOOGLE_CLIENT_IDS="$GOOGLE_CLIENT_IDS" \
              --from-literal=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
              --from-literal=APPLE_CLIENT_IDS="$APPLE_CLIENT_IDS" \
              --from-literal=APNS_KEY="$APNS_KEY" \
              --from-literal=APNS_KEY_ID="$APNS_KEY_ID" \
              --from-literal=APNS_TEAM_ID="$APNS_TEAM_ID" \
              --from-literal=APNS_APP_IDS="$APNS_APP_IDS" \
              --from-literal=FCM_SERVICE_ACCOUNT="$FCM_SERVICE_ACCOUNT" \
              --from-literal=PMO_API_URL="$PMO_API_URL" \
              --from-literal=PMO_API_KEY="$PMO_API_KEY"
          } > rendered.yaml

      - name: Deploy to k3s
        run: |
          ssh debian@${{ secrets.VPS_HOST }} \
            'KUBECONFIG=$HOME/.kube/config kubectl apply -f - && KUBECONFIG=$HOME/.kube/config kubectl -n dobre-mleko rollout status deployment/api --timeout=180s' \
            < rendered.yaml
